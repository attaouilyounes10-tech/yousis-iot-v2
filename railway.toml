# ============================================================
# Railway configuration - Monorepo Full Stack
# Déploie backend + frontend build dans un seul service
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/auth/me"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Variables d'environnement (à définir dans Railway Dashboard > Variables)
# PORT=3001                    # Railway l'injecte automatiquement
# NODE_ENV=production
# DB_PATH=/data/yousis.db
# JWT_SECRET=ton-secret-long-et-aleatoire (openssl rand -hex 32)
# ALLOWED_ORIGINS=*            # Ou ton domaine custom: https://ton-domaine.com