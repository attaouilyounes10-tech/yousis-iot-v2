# ============================================================
# YOUXIS IOT v2 — Configuration de déploiement Render
# Un seul Web Service : construit le frontend puis sert le tout
# (frontend compilé + API + WebSocket) depuis le backend Node.
# ============================================================
services:
  - type: web
    name: youxis-iot-v2
    runtime: node
    plan: free
    rootDir: backend
    # 1) installe le backend  2) installe + build le frontend (servi en prod)
    buildCommand: |
      npm install
      cd ../frontend && npm install && npm run build && cd ../backend
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        sync: false          # Render injecte automatiquement le PORT
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false          # À renseigner (valeur longue et aléatoire)
      - key: ALLOWED_ORIGINS
        sync: false          # ex: https://youxis-iot-v2.onrender.com,http://localhost:5173
